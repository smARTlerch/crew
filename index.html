<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="·">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111317">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>·</title>
<style>
  :root { --bg: #111317; --tile: #1c1f26; --line: #2c313b; --text: #f2f4f7; --muted: #9aa1ad; --acc: #0a84ff; --ok: #30d158; --warn: #ffd60a; --bad: #ff453a; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 84px); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17,19,23,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 10px 16px 8px; border-bottom: 1px solid var(--line); }
  header .top { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 22px 16px 8px; }
  .sub { color: var(--muted); font-size: 14px; }
  main { padding: 4px 0; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; background: var(--tile); color: var(--text); }
  button.primary { background: var(--acc); color: #fff; font-weight: 600; }
  button.link { background: none; color: var(--acc); padding: 6px 4px; }
  button:active { opacity: .7; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 5px 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 20px; background: var(--tile); font-size: 15px; text-align: center; line-height: 1.2; }
  .chip small { display: block; color: var(--muted); font-size: 12px; }
  .chip.on { background: var(--acc); color: #fff; }
  .chip.on small { color: #dbe9ff; }
  /* Stand des Tages: gelb = angefangen, grün = alle abgeschlossen; der gewählte Tag hat einen weissen Rand */
  .chip.st-half { background: var(--warn); color: #111; }
  .chip.st-ok { background: var(--ok); color: #111; }
  .chip.st-half small, .chip.st-ok small { color: #333; }
  .chip.on.st-half, .chip.on.st-ok { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; background: var(--tile); border-radius: 10px; padding: 3px; }
  .tabs button { flex: 1; padding: 7px; border-radius: 8px; background: none; font-size: 15px; }
  .tabs button.on { background: #3a3f4b; font-weight: 600; }
  .list { margin: 0 12px; background: var(--tile); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-radius: 0; }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .row .h { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.ok { background: var(--ok); } .dot.half { background: var(--warn); }
  .chev { color: var(--muted); font-size: 22px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); background: rgba(17,19,23,.96); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; z-index: 6; }
  .bar button.primary { flex: 1; padding: 14px; }
  .bar .sub { flex: 1; }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .card { margin: 16px 12px; background: var(--tile); border-radius: 14px; padding: 18px; }
  label.f { display: block; margin-bottom: 14px; }
  label.f > span { display: block; color: var(--muted); font-size: 14px; margin-bottom: 5px; }
  input, textarea, select { font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #262a33; color: var(--text); }
  input[type=time] { min-height: 48px; -webkit-appearance: none; }
  textarea { min-height: 70px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; background: #262a33; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; padding: 10px 4px; background: none; border-radius: 8px; font-size: 15px; }
  .seg button.on { background: var(--acc); color: #fff; font-weight: 600; }
  .stepper { display: flex; gap: 6px; align-items: center; }
  .stepper input { text-align: center; }
  .stepper button { padding: 12px 14px; }
  .stars { display: flex; gap: 4px; }
  .stars button { background: none; font-size: 30px; padding: 2px 4px; color: #4a505c; }
  .stars button.on { color: var(--warn); }
  .err { color: var(--bad); margin: 10px 0; }
  .ok { color: var(--ok); }
  dialog { border: 0; padding: 0; margin: 0; width: 100%; max-width: 100%; height: 100%; max-height: 100%; background: var(--bg); color: var(--text); }
  dialog .head { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: rgba(17,19,23,.96); border-bottom: 1px solid var(--line); z-index: 2; }
  dialog .head h3 { flex: 1; margin: 0; font-size: 17px; text-align: center; }
  dialog .body { padding: 16px 16px calc(env(safe-area-inset-bottom) + 30px); }
  .hours { font-size: 15px; color: var(--muted); margin: -4px 0 14px; }
  .xdest { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin: 8px 0 2px; }
  .xdest input { padding: 9px 10px; }
  .search { margin: 10px 12px 0; }
  .chk { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #4a505c; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #111; }
  .chk.done { background: var(--ok); border-color: var(--ok); } .chk.part { background: var(--warn); border-color: var(--warn); }
  .row.done .name { color: var(--muted); text-decoration: line-through; }
  .qty { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding: 8px 10px; }
  .big { font-size: 34px; text-align: center; font-weight: 700; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 90px); background: #2c313b; padding: 12px 14px; border-radius: 12px; text-align: center; z-index: 20; transition: opacity .4s; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 12px 10px; }
  .thumbs img { width: 76px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .cam { display: block; text-align: center; margin: 0 12px; padding: 13px; border-radius: 12px; background: var(--tile); font-weight: 600; }
  .big { width: 100%; border-radius: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="list.js"></script>
<script>
'use strict';
const C = Core;
const KEY = 'd.v1', PWKEY = 'd.pw';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { projects: {} }; } catch (_) { return { projects: {} }; } };
let db = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (_) { toast('⚠️ Speichern ging nicht (Speicher voll?)'); } };
const pwGet = () => { try { return localStorage.getItem(PWKEY) || ''; } catch (_) { return ''; } };
const pwSet = pw => { try { if (pw) localStorage.setItem(PWKEY, pw); else localStorage.removeItem(PWKEY); } catch (_) {} };
const X = XCore;
let ui = { pid: null, day: null, tab: 'time', pending: null, error: '', show: 'all', q: '' };
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// --- Fotos externer Rapporte: in IndexedDB (zu gross für localStorage) ---------------------------------------
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('d-img', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('p', mode), q = fn(t.objectStore('p')); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };
  return { all: () => tx('readonly', st => st.getAll()), put: rec => tx('readwrite', st => st.put(rec)), del: id => tx('readwrite', st => st.delete(id)) };
})();
let photos = [];
const loadPhotos = () => IDB.all().then(l => { photos = l || []; render(); }).catch(() => {});
const projPhotos = pid => photos.filter(f => f.pid === pid).sort((a, b) => a.at - b.at);
// Foto verkleinern (lange Seite 1800 px, JPEG): gut lesbar, rund 250 KB
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Foto konnte nicht gelesen werden.')); i.src = url; });
    const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    return { w, h, jpg: c.toDataURL('image/jpeg', 0.72).split(',')[1] };
  } finally { URL.revokeObjectURL(url); }
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = 0; }, 2600); setTimeout(() => t.remove(), 3100);
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const proj = () => db.projects[ui.pid];
const entry = (p, pid, d) => (p.entries || {})[C.key(pid, d)];
const planOf = (p, pid, d) => (p.plan || {})[C.key(pid, d)];
// Personal eines Tages: laut Plan nur die Eingeplanten, ohne Plan alle
// Stand eines Tages: '' = noch nichts, 'half' = etwas eingetragen, 'ok' = bei allen Anfang und Ende bestätigt
const dayState = (p, d) => {
  const list = dayPeople(p, d), es = list.map(x => entry(p, x.id, d)).filter(e => e && (e.start || e.end));
  if (!es.length) return '';
  return list.length && list.every(x => { const e = entry(p, x.id, d); return e && e.start && e.end; }) ? 'ok' : 'half';
};
const dayPeople = (p, d) => (Object.keys(p.plan || {}).length ? p.people.filter(x => planOf(p, x.id, d)) : p.people);
const dayMin = (p, d) => p.people.reduce((a, x) => a + C.workMin(entry(p, x.id, d)), 0);

// --- Link: #SC1.… → Passwort → Projekt übernehmen ----------------------------------------------------------
function takeHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h.startsWith('SC1.')) return;
  ui.pending = h;
  history.replaceState(null, '', location.pathname); // Link mit den Daten nicht im Verlauf stehen lassen
}
async function unlock(pw, remember) {
  const data = await C.open(ui.pending, pw);
  if (data.t === 'x' && data.project && data.project.id) return unlockList(data, pw, remember);
  if (data.t !== 'o' || !data.project || !data.project.id) throw new Error('Diese Daten passen nicht.');
  const old = db.projects[data.project.id];
  const p = { project: data.project, days: data.days || [], labels: data.labels || {}, people: data.people || [], plan: data.plan || {}, entries: {}, ratings: {}, sentAt: old ? old.sentAt : 0, recvAt: Date.now() };
  const m = C.merge({ people: p.people, entries: old ? old.entries : {}, ratings: old ? old.ratings : {} }, { entries: data.entries, ratings: data.ratings });
  p.entries = m.entries; p.ratings = m.ratings;
  db.projects[data.project.id] = p; save();
  pwSet(remember ? pw : '');
  ui.pending = null; ui.pid = data.project.id;
  ui.day = p.days.includes(today()) ? today() : p.days[0] || null;
  toast(old ? '✓ Projekt aktualisiert, deine Einträge sind geblieben' : '✓ Projekt übernommen');
}

// Liste zum Abhaken: Artikel mit Menge, Ziel (Projekt und Nummer)
function unlockList(data, pw, remember) {
  const id = `x-${data.project.id}`, old = db.projects[id];
  const items = (data.items || []).map(a => ({ k: X.key(a[0]), name: String(a[0] || ''), group: String(a[1] || ''), qty: Number(a[2]) || 0, sub: String(a[3] || '') })).filter(i => i.k);
  const base = { items, take: old ? old.take : {}, dest: old ? old.dest : {} };
  const m = X.merge(base, { take: data.take, dest: data.dest });
  db.projects[id] = { kind: 'x', project: data.project, strike: data.strike || '', items, take: m.take, dest: m.dest, days: [], people: [], sentAt: old ? old.sentAt : 0, recvAt: Date.now() };
  save(); pwSet(remember ? pw : '');
  ui.pending = null; ui.pid = id; ui.show = 'all'; ui.q = '';
  toast(old ? '✓ Liste aktualisiert, deine Einträge sind geblieben' : '✓ Liste übernommen');
}

function viewUnlock() {
  return `<div class="card" style="margin-top:40px">
      <form id="unl"><label class="f"><span>Passwort</span><input id="pw" type="password" autocomplete="current-password" value="${esc(pwGet())}" required></label>
      <label style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><input id="rem" type="checkbox" style="width:auto" checked> Passwort auf diesem Gerät merken</label>
      ${ui.error ? `<div class="err">⚠️ ${esc(ui.error)}</div>` : ''}
      <button class="primary" style="width:100%" id="unlBtn">Öffnen</button></form></div>`;
}

function viewHome() {
  const list = Object.entries(db.projects).sort(([, a], [, b]) => String((b.days || [])[0] || '').localeCompare(String((a.days || [])[0] || '')));
  if (!list.length) return '';
  const meta = p => (p.kind === 'x' ? (c => `📦 ${c.done} von ${c.items} abgehakt${p.dest && p.dest.no ? ` · → ${esc(p.dest.no)}` : ''}`)(X.count(p.items, p.take))
    : `${p.days.length ? `${esc(C.fmtDay(p.days[0]))}${p.days.length > 1 ? ` – ${esc(C.fmtDay(p.days[p.days.length - 1]))}` : ''} · ` : ''}${p.people.length} Personen`);
  return `<header><div class="top"><h1>Projekte</h1></div></header>
    <h2></h2><div class="list">${list.map(([id, p]) => `<button class="row" data-open="${esc(id)}"><div class="grow">
        <div class="name">${esc([p.project.no, p.project.name].filter(Boolean).join(' · '))}</div>
        <div class="meta">${meta(p)}${p.sentAt ? ` · gesendet ${new Date(p.sentAt).toLocaleDateString('de-CH')}` : ''}</div></div><span class="chev">›</span></button>`).join('')}</div>`;
}

function personMeta(e, pl) {
  if (!e) return pl ? `geplant ${esc(pl.start)}–${esc(pl.end)}${pl.note ? ' · ' + esc(pl.note) : ''}` : '<span>noch nichts</span>';
  const bits = [];
  // Anfang und Ende werden je für sich bestätigt; fehlt eines, steht die geplante Zeit da
  const part = (t, plan) => (t ? `${t} ✓` : plan ? `(${plan})` : '–');
  if (e.start || e.end || pl) bits.push(`${part(e.start, pl && pl.start)} – ${part(e.end, pl && pl.end)}${e.start && e.end && e.pause ? ` · ${e.pause}′ Pause` : ''}`);
  if (pl && e.start && e.end && (e.start !== pl.start || e.end !== pl.end)) bits.push(`geplant ${pl.start}–${pl.end}`);
  if (C.mealText(e)) bits.push(`🍴 ${C.mealText(e)}`); if (e.park) bits.push(`P ${C.PARK[e.park]}`); if (e.exp) bits.push(`CHF ${C.chf(e.exp)}`); if (e.note) bits.push('📝');
  return esc(bits.join(' · ')) || 'noch nichts';
}

function viewProject() {
  const p = proj();
  const days = p.days;
  if (!days.includes(ui.day)) ui.day = days.includes(today()) ? today() : days[0] || null;
  const head = `<header><div class="top"><button class="link" id="back">‹ Projekte</button><h1>${esc(p.project.no || p.project.name)}</h1></div>
    <div class="sub">${esc([p.project.name, p.project.place].filter(Boolean).join(' · '))}</div>
    <div class="tabs"><button data-tab="time" class="${ui.tab === 'time' ? 'on' : ''}">Zeiten</button><button data-tab="rate" class="${ui.tab === 'rate' ? 'on' : ''}">Bewertung</button></div>
    ${ui.tab === 'time' ? `<div class="chips">${days.map(d => `<button class="chip ${d === ui.day ? 'on' : ''} ${(st => (st ? `st-${st}` : ''))(dayState(p, d))}" data-day="${d}">${esc(C.fmtDay(d))}<small>${esc(p.labels[d] || (d === today() ? 'heute' : ''))}&nbsp;</small></button>`).join('')}</div>` : ''}</header>`;
  let body;
  if (!p.people.length) body = '<div class="empty">In diesem Projekt ist noch niemand.</div>';
  else if (ui.tab === 'rate') {
    body = `<h2>Bewertung fürs ganze Projekt</h2><div class="list">${p.people.map(x => { const r = p.ratings[x.id] || {};
      return `<button class="row" data-rate="${esc(x.id)}"><div class="grow"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.func || '')}${r.note ? ' · 📝' : ''}</div></div>
        <div class="h" style="color:var(--warn)">${r.stars ? '★'.repeat(r.stars) + '<span style="color:#4a505c">' + '★'.repeat(5 - r.stars) + '</span>' : '<span class="sub">–</span>'}</div><span class="chev">›</span></button>`; }).join('')}</div>`;
  } else if (!ui.day) body = '<div class="empty">Keine Tage festgelegt.</div>';
  else {
    const min = dayMin(p, ui.day);
    const row = x => { const e = entry(p, x.id, ui.day), pl = planOf(p, x.id, ui.day), m = C.workMin(e), func = (pl && pl.func) || x.func;
      return `<button class="row" data-edit="${esc(x.id)}"><span class="dot ${e && e.start && e.end ? 'ok' : e && e.start ? 'half' : ''}"></span><div class="grow"><div class="name">${esc(x.name)}</div>
        <div class="meta">${esc(func ? `${func} · ` : '')}${personMeta(e, pl)}</div></div><div class="h">${m ? C.hours(m) : ''}</div><span class="chev">›</span></button>`; };
    const list = dayPeople(p, ui.day);
    const noStart = list.filter(x => planOf(p, x.id, ui.day) && !(entry(p, x.id, ui.day) || {}).start).length;
    const noEnd = list.filter(x => planOf(p, x.id, ui.day) && (entry(p, x.id, ui.day) || {}).start && !entry(p, x.id, ui.day).end).length;
    body = `<h2>${esc(C.fmtDay(ui.day))}${min ? ` · ${C.hours(min)} Std.` : ''}</h2>
      ${noStart || noEnd ? `<div style="margin:0 12px 10px;display:flex;gap:8px">${noStart ? `<button id="okStart" style="flex:1">Anfang bestätigen (${noStart})</button>` : ''}${noEnd ? `<button id="okEnd" style="flex:1">Ende bestätigen (${noEnd})</button>` : ''}</div>` : ''}
      ${list.length ? `<div class="list">${list.map(row).join('')}</div>` : '<div class="empty">An diesem Tag ist niemand eingeplant.</div>'}
      ${list.some(x => entry(p, x.id, ui.day)) ? '<div style="text-align:center;margin:18px 0"><button class="link" id="dayClear" style="color:var(--bad)">Alle Einträge dieses Tages löschen</button></div>' : ''}
      ${(() => { const ph = projPhotos(p.project.id).filter(f => f.date === ui.day);
        return `<h2>Externe Rapporte${ph.length ? ` (${ph.length})` : ''}</h2>${ph.length ? `<div class="thumbs">${ph.map(f => `<img src="data:image/jpeg;base64,${f.jpg}" data-ph="${f.id}" alt="">`).join('')}</div>` : ''}
          <label class="cam"><input type="file" id="phIn" accept="image/*" capture="environment" hidden>📷 Foto Externer Rapport</label>`; })()}`;
  }
  const n = Object.keys(p.entries).length + Object.keys(p.ratings).length, nph = projPhotos(p.project.id).length;
  return `${head}<main>${body}
    <div style="text-align:center;margin:36px 0 12px"><button class="link" id="projDel" style="color:var(--bad)">Projekt von diesem Gerät löschen</button></div></main>
    <div class="bar"><div class="sub">${n} Einträge${nph ? ` · ${nph} Foto${nph === 1 ? '' : 's'}` : ''}${p.sentAt ? `<br>gesendet ${new Date(p.sentAt).toLocaleString('de-CH', { dateStyle: 'short', timeStyle: 'short' })}` : ''}</div>
      <button class="primary" id="send">Senden</button></div>`;
}

const takeOf = (p, i) => (p.take[i.k] ? p.take[i.k].qty : 0);
const stateOf = (p, i) => { const q = takeOf(p, i); return q >= i.qty && q > 0 ? 'done' : q > 0 ? 'part' : ''; };
function viewList() {
  const p = proj(), c = X.count(p.items, p.take), q = ui.q.trim().toLowerCase();
  const shown = p.items.filter(i => (ui.show === 'all' || (ui.show === 'open' ? stateOf(p, i) !== 'done' : stateOf(p, i))) && (!q || i.name.toLowerCase().includes(q)));
  const groups = new Map(); shown.forEach(i => { const g = i.group || 'Ohne Gruppe'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(i); });
  const head = `<header><div class="top"><button class="link" id="back">‹ Projekte</button><h1>${esc(p.project.no || p.project.name)}</h1></div>
    <div class="sub">${esc([p.project.name, p.strike ? `Abbau ${p.strike}` : ''].filter(Boolean).join(' · '))}</div>
    <div class="xdest"><input id="dNo" placeholder="Nummer" value="${esc(p.dest.no || '')}" autocapitalize="characters"><input id="dName" placeholder="weiter an Projekt" value="${esc(p.dest.name || '')}"></div>
    <div class="tabs">${[['all', `Alle ${c.items}`], ['open', `Offen ${c.open + c.part}`], ['done', `Geladen ${c.done + c.part}`]].map(([k, t]) => `<button data-show="${k}" class="${ui.show === k ? 'on' : ''}">${t}</button>`).join('')}</div></header>`;
  const row = i => { const s = stateOf(p, i), t = takeOf(p, i);
    return `<div class="row ${s}"><button class="chk ${s}" data-chk="${esc(i.k)}">${s === 'done' ? '✓' : s === 'part' ? '–' : ''}</button>
      <div class="grow" data-chk="${esc(i.k)}"><div class="name">${esc(i.name)}</div><div class="meta">${X.fmt(i.qty)} Stk.${i.sub ? ` · ${esc(i.sub)}` : ''}</div></div>
      <button class="qty" data-qty="${esc(i.k)}">${t ? X.fmt(t) : '–'}<span class="sub">/${X.fmt(i.qty)}</span></button></div>`; };
  const body = `<div class="search"><input id="q" type="search" placeholder="Suchen" value="${esc(ui.q)}"></div>
    ${shown.length ? [...groups].map(([g, list]) => `<h2>${esc(g)}</h2><div class="list">${list.map(row).join('')}</div>`).join('') : '<div class="empty">Nichts gefunden.</div>'}`;
  return `${head}<main>${body}
    <div style="text-align:center;margin:36px 0 12px"><button class="link" id="projDel" style="color:var(--bad)">Projekt von diesem Gerät löschen</button></div></main>
    <div class="bar"><div class="sub">${c.done} von ${c.items} abgehakt${c.part ? `, ${c.part} teilweise` : ''}${p.sentAt ? `<br>gesendet ${new Date(p.sentAt).toLocaleString('de-CH', { dateStyle: 'short', timeStyle: 'short' })}` : ''}</div>
      <button class="primary" id="send">Senden</button></div>`;
}
function setTake(k, qty) { const p = proj(); p.take[k] = X.cleanTake({ qty, at: Date.now() }); save(); }
function editQty(k) {
  const p = proj(), i = p.items.find(x => x.k === k), t = takeOf(p, i);
  const html = `<div class="sub" style="margin-bottom:14px">${X.fmt(i.qty)} Stk. auf der Liste${i.group ? ` · ${esc(i.group)}` : ''}</div>
    <label class="f"><span>Geladen</span><div class="stepper"><button type="button" data-d="-1">−</button><input id="xQ" class="big" type="number" inputmode="decimal" min="0" step="any" value="${t || ''}" placeholder="0"><button type="button" data-d="1">+</button></div></label>
    <div class="grid2"><button type="button" id="xNone">Nichts</button><button type="button" id="xAll">Alle ${X.fmt(i.qty)}</button></div>`;
  sheet(i.name, html, dlg => setTake(k, $('#xQ', dlg).value || 0), (dlg, close) => {
    const inp = $('#xQ', dlg);
    dlg.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { inp.value = Math.max(0, (Number(inp.value) || 0) + Number(b.dataset.d)); });
    $('#xNone', dlg).onclick = () => { setTake(k, 0); close(); render(); };
    $('#xAll', dlg).onclick = () => { setTake(k, i.qty); close(); render(); };
  });
}
function bindList() {
  const p = proj();
  document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { ui.show = b.dataset.show; render(); });
  document.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => { const i = p.items.find(x => x.k === b.dataset.chk); setTake(i.k, takeOf(p, i) > 0 ? 0 : i.qty); render(); });
  document.querySelectorAll('[data-qty]').forEach(b => b.onclick = () => editQty(b.dataset.qty));
  const dest = () => { p.dest = X.cleanDest({ no: $('#dNo').value, name: $('#dName').value, at: Date.now() }); save(); };
  $('#dNo').onchange = dest; $('#dName').onchange = dest;
  const q = $('#q'); q.oninput = () => { ui.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
}

function render() {
  const app = $('#app');
  if (ui.pending) app.innerHTML = viewUnlock();
  else if (ui.pid && db.projects[ui.pid] && db.projects[ui.pid].kind === 'x') app.innerHTML = viewList();
  else if (ui.pid && db.projects[ui.pid]) app.innerHTML = viewProject();
  else { ui.pid = null; app.innerHTML = viewHome(); }
  bind();
}

function bind() {
  const f = $('#unl');
  if (f) f.onsubmit = async ev => {
    ev.preventDefault(); ui.error = '';
    const btn = $('#unlBtn'); btn.disabled = true; btn.textContent = 'Entschlüssle …';
    try { await unlock($('#pw').value, $('#rem').checked); } catch (err) { ui.error = err.message; }
    render();
  };
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { ui.pid = b.dataset.open; ui.day = null; ui.tab = 'time'; ui.show = 'all'; ui.q = ''; render(); scrollTo(0, 0); });
  if ($('#back')) $('#back').onclick = () => { ui.pid = null; render(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { ui.day = b.dataset.day; render(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editEntry(b.dataset.edit));
  document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => editRating(b.dataset.rate));
  if ($('#send')) $('#send').onclick = send;
  if ($('#projDel')) $('#projDel').onclick = () => {
    const p = proj(), sent = Math.max(p.sentAt || 0, p.recvAt || 0); // nur hier geänderte, noch nicht gesendete Einträge
    const open = (p.kind === 'x' ? [...Object.values(p.take), p.dest] : [...Object.values(p.entries), ...Object.values(p.ratings), ...projPhotos(p.project.id)]).filter(e => (e.at || 0) > sent).length;
    const name = [p.project.no, p.project.name].filter(Boolean).join(' · ');
    if (open && !confirm(`${open} ${open === 1 ? 'Eintrag wurde' : 'Einträge wurden'} noch nicht gesendet und ${open === 1 ? 'geht' : 'gehen'} verloren.\nTrotzdem löschen?`)) return;
    if (!confirm(`Projekt „${name}“ mit allen Einträgen von diesem Gerät löschen?`)) return;
    projPhotos(p.project.id).forEach(f => IDB.del(f.id).catch(() => {}));
    photos = photos.filter(f => f.pid !== p.project.id);
    delete db.projects[ui.pid]; save(); ui.pid = null; render(); toast('✓ Projekt gelöscht');
  };
  if (proj() && proj().kind === 'x') { bindList(); return; }
  if ($('#phIn')) $('#phIn').onchange = async ev => {
    const p = proj(), d = ui.day, files = [...ev.target.files];
    for (const f of files) {
      try { const r = await shrink(f); await IDB.put({ id: Math.random().toString(36).slice(2, 10).padEnd(8, '0'), pid: p.project.id, date: d, at: Date.now(), ...r }); }
      catch (err) { alert(err.message); }
    }
    await loadPhotos(); toast(files.length > 1 ? `✓ ${files.length} Fotos gespeichert` : '✓ Foto gespeichert');
  };
  document.querySelectorAll('[data-ph]').forEach(im => im.onclick = () => {
    const f = photos.find(x => x.id === im.dataset.ph); if (!f) return;
    sheet(`Externer Rapport · ${C.fmtDay(f.date)}`, `<img class="big" src="data:image/jpeg;base64,${f.jpg}" alt="">
      <button type="button" id="phDel" class="link" style="color:var(--bad);margin-top:16px">Foto löschen</button>`, () => {}, (dlg, close) => {
      $('#phDel', dlg).onclick = async () => { if (!confirm('Foto löschen?')) return; await IDB.del(f.id).catch(() => {}); close(); loadPhotos(); };
    });
  });
  if ($('#dayClear')) $('#dayClear').onclick = () => {
    const p = proj(), had = dayPeople(p, ui.day).filter(x => entry(p, x.id, ui.day));
    if (!confirm(`${had.length} ${had.length === 1 ? 'Eintrag' : 'Einträge'} vom ${C.fmtDay(ui.day)} löschen?\nDanach steht wieder die geplante Zeit da.`)) return;
    had.forEach(x => delete p.entries[C.key(x.id, ui.day)]);
    save(); render(); toast('✓ Einträge gelöscht');
  };
  // Morgens: Anfang laut Plan für alle ohne Anfang; abends: Ende laut Plan für alle mit Anfang und ohne Ende. Nie überschreiben.
  const confirmAll = which => {
    const p = proj(), d = ui.day;
    const todo = dayPeople(p, d).filter(x => { const pl = planOf(p, x.id, d), e = entry(p, x.id, d) || {}; return pl && (which === 'start' ? !e.start : e.start && !e.end); });
    if (!todo.length) return;
    const what = which === 'start' ? 'den geplanten Anfang' : 'das geplante Ende';
    if (!confirm(`Für ${todo.length} ${todo.length === 1 ? 'Person' : 'Personen'} ${what} bestätigen?\nBereits bestätigte Zeiten bleiben, wie sie sind.`)) return;
    todo.forEach(x => {
      const pl = planOf(p, x.id, d), e = entry(p, x.id, d) || { pause: C.PAUSE };
      p.entries[C.key(x.id, d)] = C.cleanEntry({ ...e, [which]: pl[which], at: Date.now() });
    });
    save(); render(); toast(which === 'start' ? '✓ Anfang bestätigt – Abweichungen einzeln anpassen' : '✓ Ende bestätigt – Abweichungen einzeln anpassen');
  };
  if ($('#okStart')) $('#okStart').onclick = () => confirmAll('start');
  if ($('#okEnd')) $('#okEnd').onclick = () => confirmAll('end');

  const on = $('.chip.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// --- Eintrag pro Person und Tag --------------------------------------------------------------------------
function sheet(title, html, onSave, extra) {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<div class="head"><button class="link" data-x>Abbrechen</button><h3>${esc(title)}</h3><button class="link" data-ok style="font-weight:700">Fertig</button></div><div class="body">${html}</div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('[data-x]').onclick = close;
  dlg.querySelector('[data-ok]').onclick = () => { onSave(dlg); close(); render(); };
  if (extra) extra(dlg, close);
  return dlg;
}
function editEntry(id) {
  const p = proj(), x = p.people.find(y => y.id === id), d = ui.day, pl = planOf(p, id, d);
  const e = entry(p, id, d) || { start: '', end: '', pause: C.PAUSE, meal: false, dinner: false, park: '', exp: 0, expText: '', note: '' };
  let park = e.park; const food = { meal: !!e.meal, dinner: !!e.dinner };
  // gleiche Zeiten für alle nur ohne Plan (sonst gilt pro Person die geplante Zeit)
  const others = Object.keys(p.plan || {}).length ? 0 : dayPeople(p, d).filter(y => y.id !== id && !entry(p, y.id, d)).length;
  const html = `<div class="sub" style="margin-bottom:14px">${esc((pl && pl.func) || x.func || '')} · ${esc(C.fmtDay(d))}${pl ? `<br>geplant ${esc(pl.start)}–${esc(pl.end)}${pl.note ? ` · ${esc(pl.note)}` : ''}` : ''}</div>
    <div class="grid2"><label class="f"><span>Anfang</span><input type="time" id="eS" value="${esc(e.start)}"></label>
      <label class="f"><span>Ende</span><input type="time" id="eE" value="${esc(e.end)}"></label></div>
    <div class="grid2" style="margin:-6px 0 14px">${['S', 'E'].map(k => `<div style="display:flex;gap:6px">${pl ? `<button type="button" class="small" data-fill="${k}" data-t="${esc(k === 'S' ? pl.start : pl.end)}" style="flex:1;padding:8px 4px;font-size:14px">${esc(k === 'S' ? pl.start : pl.end)} geplant</button>` : ''}<button type="button" data-fill="${k}" data-t="now" style="flex:1;padding:8px 4px;font-size:14px">jetzt</button></div>`).join('')}</div>
    <label class="f"><span>Pause (Minuten)</span><div class="stepper"><button type="button" data-p="-15">−</button><input id="eP" type="number" inputmode="numeric" min="0" max="720" step="5" value="${e.pause}"><button type="button" data-p="15">+</button></div></label>
    <div class="hours" id="eH"></div>
    <label class="f"><span>Essen (antippen, beides möglich)</span><div class="seg" id="eM"><button type="button" data-m="meal">Mittagessen</button><button type="button" data-m="dinner">Abendessen</button></div></label>
    <label class="f"><span>Parkticket</span><div class="seg" id="eK">${Object.entries(C.PARK).map(([k, v]) => `<button type="button" data-v="${k}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div></label>
    <div class="grid2"><label class="f"><span>Spesen CHF</span><input id="eX" type="text" inputmode="decimal" placeholder="0.00" value="${e.exp ? esc(String(e.exp)) : ''}"></label>
      <label class="f"><span>Spesen für</span><input id="eXT" type="text" placeholder="z.B. Parkhaus" value="${esc(e.expText)}"></label></div>
    <label class="f"><span>Sonstiges</span><textarea id="eN" placeholder="Bemerkung">${esc(e.note)}</textarea></label>
    ${others ? `<button type="button" id="eAll" style="width:100%;margin-top:6px">Anfang, Ende und Pause für alle ohne Eintrag übernehmen (${others})</button>` : ''}
    ${entry(p, id, d) ? '<button type="button" id="eDel" class="link" style="color:var(--bad);margin-top:16px">Eintrag löschen</button>' : ''}`;
  const read = dlg => C.cleanEntry({ start: $('#eS', dlg).value, end: $('#eE', dlg).value, pause: $('#eP', dlg).value, meal: food.meal, dinner: food.dinner, park, exp: $('#eX', dlg).value, expText: $('#eXT', dlg).value, note: $('#eN', dlg).value, at: Date.now() });
  sheet(x.name, html, dlg => {
    const me = read(dlg);
    // Mittag- bzw. Abendessen bei der ersten Person des Tages: auf Wunsch für alle an diesem Tag (nur das Essen, sonst nichts ändern)
    const rest = dayPeople(p, d).filter(y => y.id !== id);
    const first = k => me[k] && !(entry(p, id, d) || {})[k] && !rest.some(y => (entry(p, y.id, d) || {})[k]);
    const ask = ['meal', 'dinner'].filter(first);
    p.entries[C.key(id, d)] = me;
    const what = ask.map(k => (k === 'meal' ? 'Mittagessen' : 'Abendessen')).join(' und ');
    if (ask.length && rest.length && confirm(`${what} für alle ${rest.length + 1} Personen am ${C.fmtDay(d)} eintragen?`)) {
      rest.forEach(y => { const e2 = entry(p, y.id, d) || { pause: C.PAUSE }; p.entries[C.key(y.id, d)] = C.cleanEntry({ ...e2, ...Object.fromEntries(ask.map(k => [k, true])), at: Date.now() }); });
      toast(`✓ ${what} für alle eingetragen`);
    }
    save();
  }, (dlg, close) => {
    const segs = () => {
      dlg.querySelectorAll('#eM button').forEach(b => b.classList.toggle('on', food[b.dataset.m]));
      dlg.querySelectorAll('#eK button').forEach(b => b.classList.toggle('on', b.dataset.v === park));
    };
    const hrs = () => { const m = C.workMin(read(dlg)); $('#eH', dlg).textContent = m ? `= ${C.hours(m)} Std.` : ''; };
    dlg.querySelectorAll('#eM button').forEach(b => b.onclick = () => { food[b.dataset.m] = !food[b.dataset.m]; segs(); });
    dlg.querySelectorAll('#eK button').forEach(b => b.onclick = () => { park = b.dataset.v; segs(); });
    dlg.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const i = $('#eP', dlg); i.value = Math.max(0, Math.min(720, (Number(i.value) || 0) + Number(b.dataset.p))); hrs(); });
    ['#eS', '#eE', '#eP'].forEach(s => $(s, dlg).addEventListener('input', hrs));
    segs(); hrs();
    // Anfang bzw. Ende einzeln setzen: geplante Zeit oder jetzt (auf 5 Minuten gerundet)
    dlg.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => {
      let t = b.dataset.t;
      if (t === 'now') { const n = new Date(), m = Math.round((n.getHours() * 60 + n.getMinutes()) / 5) * 5 % 1440; t = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }
      $(b.dataset.fill === 'S' ? '#eS' : '#eE', dlg).value = t; hrs();
    });
    if ($('#eAll', dlg)) $('#eAll', dlg).onclick = () => {
      const me = read(dlg), todo = dayPeople(p, d).filter(y => y.id !== id && !entry(p, y.id, d));
      if (!todo.length || !confirm(`Anfang ${me.start || '–'}, Ende ${me.end || '–'}, Pause ${me.pause}′ für ${todo.length} ${todo.length === 1 ? 'Person' : 'Personen'} ohne Eintrag übernehmen?\nBestehende Einträge bleiben, wie sie sind.`)) return;
      p.entries[C.key(id, d)] = me;
      todo.forEach(y => { p.entries[C.key(y.id, d)] = C.cleanEntry({ start: me.start, end: me.end, pause: me.pause, at: Date.now() }); });
      save(); close(); render(); toast('✓ Zeiten übernommen');
    };
    if ($('#eDel', dlg)) $('#eDel', dlg).onclick = () => { if (!confirm('Eintrag löschen?')) return; delete p.entries[C.key(id, d)]; save(); close(); render(); };
  });
}
function editRating(id) {
  const p = proj(), x = p.people.find(y => y.id === id), r = p.ratings[id] || { stars: 0, note: '' };
  let stars = r.stars;
  const html = `<div class="sub" style="margin-bottom:14px">${esc(x.func || '')} · ganzes Projekt</div>
    <label class="f"><span>Sterne</span><div class="stars" id="rS">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}">★</button>`).join('')}</div></label>
    <label class="f"><span>Bemerkung für die Dispo</span><textarea id="rN" placeholder="z.B. zuverlässig, gerne wieder">${esc(r.note)}</textarea></label>`;
  sheet(x.name, html, dlg => { p.ratings[id] = C.cleanRating({ stars, note: $('#rN', dlg).value, at: Date.now() }); save(); }, dlg => {
    const draw = () => dlg.querySelectorAll('#rS button').forEach(b => b.classList.toggle('on', Number(b.dataset.n) <= stars));
    dlg.querySelectorAll('#rS button').forEach(b => b.onclick = () => { stars = Number(b.dataset.n) === stars ? 0 : Number(b.dataset.n); draw(); });
    draw();
  });
}

// --- Zurück: verschlüsselte Textdatei über AirDrop oder Mail -------------------------------------------------
async function send() {
  const p = proj();
  let pw = pwGet();
  if (!pw) { pw = prompt('Passwort:') || ''; if (!pw) return; }
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'Verschlüssle …';
  try {
    const head = { id: p.project.id, no: p.project.no, name: p.project.name };
    const text = await C.seal(p.kind === 'x' ? { t: 'y', v: 1, project: head, take: p.take, dest: p.dest, at: Date.now() }
      : { t: 'b', v: 1, project: head, entries: p.entries, ratings: p.ratings, photos: projPhotos(p.project.id).map(({ id, date, at, w, h, jpg }) => ({ id, date, at, w, h, jpg })), at: Date.now() }, pw);
    const safe = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9-]+/g, '-').replace(/^-|-$/g, '');
    const name = `${safe(p.project.no || p.project.name) || 'Projekt'}${p.kind === 'x' ? '_Liste' : ''}.txt`;
    const file = new File([text], name, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); p.sentAt = Date.now(); save(); toast('✓ Gesendet'); }
      catch (err) { if (err.name !== 'AbortError') throw err; }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      p.sentAt = Date.now(); save(); toast('✓ Datei gespeichert');
    }
  } catch (err) { alert(`Senden ging nicht: ${err.message}`); }
  render();
}
